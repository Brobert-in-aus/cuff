[package]
name = "cuff-recorder"
version = "0.1.0"
edition = "2021"
description = "Cuff's recorder for the Steam Frame's panel output, from Framecorder's"
license = "MIT"

[lib]
name = "cuff_recorder"
path = "src/lib.rs"

[[bin]]
name = "cuff-recorder"
path = "src/main.rs"

[[bin]]
name = "cuff-grab"
path = "src/bin/cuff-grab.rs"

[dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
clap = { version = "4", features = ["derive"] }
drm = "0.15"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
ffmpeg-sys-next = { version = "8.0", default-features = false, features = ["avcodec", "avformat"] }
libc = "0.2"
log = "0.4"
pipewire = "0.10"
v4l2r = "0.0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
